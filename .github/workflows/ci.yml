name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y libayatana-appindicator3-dev
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
